// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.versions = [
            kotlin             : "1.4.32",
            coroutines         : "1.4.2",
            corectx            : "1.3.2",
            navigation         : "2.3.5",
            activity_ktx       : "1.2.2",
            fragment_ktx       : "1.3.3",
            lifecyclectx       : "2.3.1",
            appcompat          : "1.2.0",
            material           : "1.3.0",
            constraintlayout   : "2.0.4",
            retrofit2          : "2.9.0",
            dagger_hilt        : "2.35",
            hilt               : "1.0.0-beta01",
            logging_interceptor: "4.9.0",
            room               : "2.2.6",
            maps               : "17.0.0",
            location           : "18.0.0",
            input_mask         : "6.0.0",
            google_services    : "4.3.5",
            firebase_bom       : "26.8.0",
            arcore             : "1.23.0",
            sceneform          : "1.17.1",
            browser            : "1.3.0"
    ]
    ext.retrofit2 = [
            retrofit     : "com.squareup.retrofit2:retrofit:$versions.retrofit2",
            convertergson: "com.squareup.retrofit2:converter-gson:$versions.retrofit2"
    ]
    ext.navigation = [
            navigationfragmentktx: "androidx.navigation:navigation-fragment-ktx:$versions.navigation",
            navigationuiktx      : "androidx.navigation:navigation-ui-ktx:$versions.navigation",
            safe_args_plugin     : "androidx.navigation:navigation-safe-args-gradle-plugin:$versions.navigation"

    ]
    ext.dagger_hilt = [
            android_gradle_plugin: "com.google.dagger:hilt-android-gradle-plugin:$versions.dagger_hilt",
            android              : "com.google.dagger:hilt-android:$versions.dagger_hilt",
            android_compiler     : "com.google.dagger:hilt-android-compiler:$versions.dagger_hilt"
    ]
    ext.jetpack_hilt = [
            navigation_fragment: "androidx.hilt:hilt-navigation-fragment:$versions.hilt"
    ]
    ext.room = [
            runtime : "androidx.room:room-runtime:$versions.room",
            compiler: "androidx.room:room-compiler:$versions.room",
            ktx     : "androidx.room:room-ktx:$versions.room"
    ]
    ext.gms = [
            google_services: "com.google.gms:google-services:$versions.google_services",
            maps           : "com.google.android.gms:play-services-maps:$versions.maps",
            location       : "com.google.android.gms:play-services-location:$versions.location"
    ]
    ext.firebase = [
            bom        : "com.google.firebase:firebase-bom:$versions.firebase_bom",
            analytics  : "com.google.firebase:firebase-analytics-ktx",
            messaging  : "com.google.firebase:firebase-messaging-ktx",
            crashlytics: "com.google.firebase:firebase-crashlytics-ktx",
            crashlytics_gradle: "com.google.firebase:firebase-crashlytics-gradle:2.6.1"
    ]
    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.1.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$versions.kotlin"
        classpath dagger_hilt.android_gradle_plugin
        classpath navigation.safe_args_plugin
        classpath gms.google_services
        classpath firebase.crashlytics_gradle

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}