// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.versions = [
            kotlin          : "1.4.21",
            coroutines      : "1.4.2",
            corectx         : "1.3.2",
            navigation      : "2.3.2",
            fragmentctx     : "1.2.5",
            lifecyclectx    : "2.2.0",
            appcompat       : "1.2.0",
            material        : "1.2.1",
            constraintlayout: "2.0.4",
            retrofit2       : "2.9.0",
            hilt            : "2.31-alpha",
            jetpackhilt     : "1.0.0-alpha02"
    ]
    ext.retrofit2 = [
            retrofit     : "com.squareup.retrofit2:retrofit:$versions.retrofit2",
            convertergson: "com.squareup.retrofit2:converter-gson:$versions.retrofit2"
    ]
    ext.navigation = [
            navigationfragmentktx: "androidx.navigation:navigation-fragment-ktx:$versions.navigation",
            navigationuiktx      : "androidx.navigation:navigation-ui-ktx:$versions.navigation"

    ]
    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$versions.kotlin"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$versions.hilt"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}